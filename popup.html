<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Субтитры Rezka</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="mark">EN <span>↔</span> RU</div>
  <h1>Смотреть и понимать</h1>

  <div id="status" role="status">Проверяю страницу…</div>
  <button id="connect" hidden>Подключить к этой странице</button>

  <p id="origins" class="small"></p>
